# Scenario suite against the deployed stage `poc` (docs/test-plan.md §4), on demand. The runner
# drives every flow through the QA driver Lambda with the qa-runner role of the bootstrap
# (ADR-0005); no human credentials. Only `main` can assume the role, so dispatch it from main.
name: Scenarios poc

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run (smoke or full)
        type: choice
        options:
          - full
          - smoke
        default: full

permissions:
  id-token: write
  contents: read

concurrency:
  group: scenarios-poc
  cancel-in-progress: false

env:
  CI: "true"
  AWS_REGION: us-east-1

jobs:
  scenarios:
    name: Scenario suite
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assume the qa-runner role (OIDC, no access keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_QA_RUNNER_ROLE_ARN || 'arn:aws:iam::776805327629:role/aws-cds-hackathon-poc-legajo-qa-runner' }}
          role-session-name: github-scenarios-${{ github.run_id }}
          aws-region: us-east-1

      - name: Run the suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [ ! -f scripts/scenarios/run.ts ]; then
            echo "::notice::scenarios skipped: scripts/scenarios/run.ts is not in the repository yet (WP-37)."
            exit 0
          fi
          npm run scenarios -- --suite "${SUITE}"
